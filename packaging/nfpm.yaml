# nfpm config for the .deb and .rpm release artifacts (https://nfpm.goreleaser.com).
#
# One config for both formats and both Linux arches — nfpm expands ${VAR} from the
# environment, and release.yml sets MILO_VERSION / MILO_DEB_ARCH / MILO_BIN per run.
#
# These packages are attached to the GitHub release for `dpkg -i` / `rpm -i`. There is
# deliberately no apt or yum repository behind them: a real one means a signing key,
# pool layout, and a host to keep alive, which is a lot of upkeep for a young toolchain.

name: milo
arch: ${MILO_DEB_ARCH}
version: ${MILO_VERSION}
# The commit that produced this binary, as the package revision — so the full version
# reads `0.1.0-g1a2b3c4` and a bug report naming a .deb identifies the source exactly.
# Same value `milo --version` reports; a rebuild of one tag can't masquerade as another.
release: ${MILO_RELEASE}
section: devel
priority: optional
maintainer: Chad Smith <chadsmith.software@gmail.com>
description: |
  A memory-safe systems language that compiles to LLVM IR.
  Milo gives Rust's memory-safety guarantees without lifetime annotations:
  single-owner move semantics, second-class references, no GC and no
  reference counting.
vendor: milo-language
homepage: https://milo-language.github.io/milo/
license: MIT

contents:
  # A fixed path, not ${MILO_BIN}: nfpm expands ${VAR} in scalar fields but resolves
  # `src` as a glob first, so an env var here fails with "no matching files". The
  # caller stages the arch's binary at dist/milo instead.
  - src: dist/milo-opt
    dst: /usr/bin/milo-opt
    file_info:
      mode: 0755
  - src: dist/milo
    dst: /usr/bin/milo
    file_info:
      mode: 0755

# clang links the object files milo emits, so a package without it installs fine and
# then fails on the first build. Recommends rather than Depends: `milo emit-ir`,
# `emit-ast`, and the LSP all work without a linker.
# The compiler compiles through the clang of milo-opt's LLVM (docs/mlir-backend.md).
recommends:
  - clang-23
  - llvm-23

rpm:
  # rpmbuild otherwise picks its own compression per host and the artifact name drifts.
  compression: gzip
