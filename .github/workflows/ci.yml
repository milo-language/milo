name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/breakingChanges.test.ts diffs the public std surface against the last
          # release tag. actions/checkout fetches no tags by default, so the gate found
          # none and failed rather than silently passing — which is the right failure,
          # but the fix belongs here.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # tests/typecheck.test.ts runs tsc, which needs @types/bun from node_modules —
      # without it every `console`/`process`/`Buffer` is an error. `bun test` happens to
      # run fine without deps, which is exactly why this gap stayed invisible.
      - run: bun install --frozen-lockfile
      # z3 lets the contract gate (tests/verify-contracts.test.ts) discharge the
      # nonlinear/bitwise contracts the native QF_LIA prover can only mark unknown.
      # If this step ever flakes, the gate falls back to the native solver (fewer
      # proofs, still green) rather than failing the build.
      - run: brew install z3
      # lld provides ld.lld, which `milo build --target=cortex-m3` invokes via
      # -fuse-ld=lld to link freestanding ARM ELF executables (tests/embedded.test.ts).
      - run: brew install lld
      # 14 of the shipped examples — every game, both raytracers, the simulations — bind
      # SDL2 through the `sdl` package and fail at LINK time without it ("ld: library
      # 'SDL2' not found"). tests/examples.test.ts never noticed because it stops at
      # emit-ir; scripts/run-examples.ts links and runs, which is the point of it.
      - run: brew install sdl2
      # Sync the dependencies of every example that declares some. Two things skip
      # silently without them: an example whose package cannot resolve is type-checked no
      # further (~4.5k lines of apsis), and a FIXTURE carrying `@requires-package` is
      # skipped by tests/run.test.ts (flybyGeometry, which needs `gl`). That is why this
      # runs BEFORE `bun test` rather than next to the example harness -- placed after it,
      # the fixture stayed skipped on every CI run and said so in a line nobody reads.
      #
      # NON-FATAL on purpose: the only step in this lane that reaches the network for a
      # package, and a registry hiccup must not redden a run about the compiler. When it
      # fails, both harnesses fall back to the skips they already do.
      - name: Sync example package deps (non-fatal)
        continue-on-error: true
        run: |
          for f in $(find examples -name milo.json); do
            (cd "$(dirname "$f")" && bun run "$GITHUB_WORKSPACE/src/main.ts" install) || true
          done
      - run: bun test
      # Checks every scalar-returning `extern fn` against this runner's real headers.
      # Needs no annotations; see the script's header for what it does and doesn't cover.
      - run: bun run scripts/audit-extern-returns.ts
      # tests/examples.test.ts only emit-ir's the examples — it never links or RUNS one, so
      # a codegen bug that produces valid-looking IR and a broken binary passes it. This
      # script builds every entry point through clang and executes the 32 that carry a
      # `// @run:` annotation. It existed and was wired to nothing.
      - run: bun run scripts/run-examples.ts

      # A fixture that leaks still prints the right bytes, so `bun test` cannot see one.
      # That blind spot let the self-hosted compiler leak every owned local for months
      # while the sweep stayed green. This ratchets against tests/leak-clean.txt.
      # macOS gets `leaks -atExit`; LeakSanitizer does not exist on darwin/arm64.
      - name: Leak ratchet
        run: bun run scripts/leak-check.ts --check
      # `milo build --sanitize` existed for a long time and nothing ran it over the corpus.
      # scripts/selfhost-asan.ts asks whether milo-self's OUTPUT is memory-safe; nobody asked
      # it of the reference compiler's output, so use-after-free, out-of-bounds and
      # double-free in generated code had no gate. The leak ratchet above cannot see any of
      # those — different question, and it only sees blocks big enough for `leaks` to report.
      #
      # COST, measured on this runner rather than guessed: 4m38s for the fixtures corpus
      # (run 32382533309), against 9m11s for the leak ratchet immediately above. Each entry
      # is its own -fsanitize=address build plus a run, so it scales with the corpus.
      # If it ever starts hurting, the precedent is in .github/workflows/selfhost.yml: keep
      # the fast check on push, move the slow sweep to the nightly schedule. It finds
      # nothing today — the whole value is catching a future regression, which argues for
      # running it often rather than rarely.
      # `bun run test:asan` is the same command developers run locally (package.json), so
      # the two cannot drift. It does NOT consult tests/known-red.txt: a fixture the test
      # driver excuses is still built and run here, which is where an open hole shows red.
      - name: AddressSanitizer sweep
        run: bun run test:asan

      # The two soundness fuzzers (docs/plans/soundness-sweep-2026-09.md, WP5b/WP5c).
      # Small counts here so the job stays under a few minutes; the generator shapes are
      # the language's threat model, so a new rule gets a shape and this step is what
      # keeps asking. Reduction is off: a red here is triaged locally with --keep.
      - name: Soundness fuzzers
        run: |
          bun run fuzz:tasks --n=100 --seed=${{ github.run_number }} --reduce-probes=0
          bun run fuzz:generic-drop --seed=${{ github.run_number }}

  # Nothing has ever executed std/*.linux.milo — epoll, eventfd, the glibc paths — because
  # the suite above runs on macOS only. This job is the first thing that does.
  #
  # It is NOT known-green: it has never run. Verifying it locally wasn't possible — a
  # container is ~5x slower than the host, so the fixture-compile pool blows its 300s
  # budget and every test cascades to failure for a reason that says nothing about Linux.
  # A CI runner is the cheapest honest answer. If this goes red, read the failures before
  # assuming the job is at fault: the point is that this code has never been tested.
  #
  # Two architectures, because nothing here ever exercised linux-arm64 and the gap was
  # not theoretical: milojs's release job, built against this compiler's rolling
  # `latest`, aborted on that target from 2026-08-15 with `free(): invalid pointer` on a
  # hello-world while linux-x64 and darwin-arm64 were clean. A failure belongs here,
  # against the fixture suite, not downstream. `ubuntu-24.04-arm` is a GitHub-hosted
  # arm64 runner, free for public repos.
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for tests/breakingChanges.test.ts
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # clang is what milo shells out to for every compile, so the job cannot work without
      # it — but it was never installed here, only inherited from whatever the runner image
      # happened to ship. That is a dependency on an image GitHub rebuilds continuously: a
      # run went red with "no C compiler found: need either 'clang' or 'llc'+'cc' on PATH"
      # twelve minutes after an identical run passed. Install it rather than hope for it.
      # Noble's `clang` metapackage is clang-18, comfortably over MIN_CLANG_MAJOR (16) in
      # src/main.ts; if a future image defaults below that, detectToolchain says so by
      # version and the dump below shows what resolved.
      #
      # z3 mirrors the macOS job's contract gate. lld provides ld.lld for the bare-metal
      # ARM link; qemu-system-arm runs those binaries (tests/embedded.test.ts skips itself
      # when QEMU is absent, so without it that lane silently proves nothing).
      #
      # libgl1-mesa-dev is the Linux half of what macOS gets for free: OpenGL is a system
      # framework there, so the gl package links with nothing installed, while here it needs
      # the dev package or `-lGL` fails. flybyGeometry reaches it transitively (world3d ->
      # live -> cloud -> gl) and started actually running once the dep sync moved ahead of
      # `bun test`, at which point this job was the only one that could not link it. The
      # alternative was `@skip-os: linux`, which buys a green tick by deleting the coverage.
      - run: sudo apt-get update && sudo apt-get install -y clang z3 lld qemu-system-arm libssl-dev libsqlite3-dev libgl1-mesa-dev
      # When this job goes red, the toolchain it actually resolved is the first thing you
      # need and the most annoying to get after the fact (mirrors the Windows job).
      - name: Toolchain info
        run: clang --version && clang -print-target-triple
        continue-on-error: true
      - name: Sync example package deps (non-fatal)
        continue-on-error: true
        run: |
          for f in $(find examples -name milo.json); do
            (cd "$(dirname "$f")" && bun run "$GITHUB_WORKSPACE/src/main.ts" install) || true
          done
      - run: bun test
      # Reads this runner's headers, so it's the only thing that can check the Linux decls.
      - run: bun run scripts/audit-extern-returns.ts

  # Windows is a partial target: the compiler runs, resolves x86_64-pc-windows-msvc, and
  # builds+runs the fixture suite minus the parts that need APIs Windows has no
  # equivalent for (IOCP-based green IO, fork/signals, OpenSSL, pty, regex). Those
  # fixtures carry `// @skip-os: win32` with the reason inline, so the skip list IS the
  # remaining port work — see docs/roadmap.md.
  #
  # This is the only place generated code executes on real Windows. The mac/linux dev
  # loop cross-compiles via xwin and runs under Wine (`bun scripts/windows-sweep.ts`),
  # which validates the link and the CRT calls but is not the OS. This job is the
  # authority on "does it actually run".
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for tests/breakingChanges.test.ts
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # clang emits the COFF object and drives the link; the runner's bundled MSVC
      # supplies the CRT and SDK, which clang locates on its own on a real Windows host
      # (no xwin / MILO_WINDOWS_SDK needed here — that is the cross-compile path only).
      - name: Install LLVM
        run: choco install llvm --no-progress -y
      # Dump the toolchain up front: when this job goes red, the version/triple it
      # actually resolved is the first thing you need and the most annoying to get.
      - name: Toolchain info
        run: |
          clang --version
          clang -print-target-triple
          bun run src/main.ts --help | Select-String -Pattern "target" -SimpleMatch
        continue-on-error: true
      - run: bun test tests/hostTarget.test.ts
      # The end-to-end proof, kept separate from the test runner so a failure here is
      # unambiguous: the compiler built a PE and Windows itself executed it.
      - name: Build and run hello.exe
        run: |
          bun run src/main.ts build examples/hello.milo -o hello
          ./hello.exe
      # The real coverage: every fixture without `@skip-os: win32` compiles to a PE and
      # its stdout is matched on Windows. Slower than the other runners (fewer cores,
      # clang-on-COFF), hence the widened job timeout.
      - name: Fixture suite
        run: bun test tests/run.test.ts
        timeout-minutes: 45
      # NOTE: `scripts/audit-extern-returns.ts` is deliberately NOT run here yet. It works
      # on Windows (clang-detecting, Windows-header-aware) and correctly finds that
      # `socket`/`accept` return `SOCKET` (8 bytes), not `int` — but that is the unfinished
      # Winsock tier (their `sockfd` params are `i32` too; the whole net layer needs the
      # restructure), so gating this job on a clean audit would mean no green Windows CI
      # until Winsock lands. Turn this on once that tier is done. It already runs on the
      # mac/linux jobs, where it is clean.
      # On failure the IR is what you need and cannot get afterwards; emitting it costs
      # a second and turns a red X into something diagnosable without a second push.
      - name: Emit IR on failure
        if: failure()
        run: bun run src/main.ts emit-ir examples/hello.milo
        continue-on-error: true
