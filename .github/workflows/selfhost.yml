name: Self-host

# milo-self is the Milo compiler written in Milo. Until this workflow existed, nothing in
# CI ever built it: the bootstrap gates (selfhost.sh, the fixpoint, the rejects ratchet,
# the fixture sweep) ran by hand, on one developer's Mac. So "milo-self works" has always
# meant "worked on darwin-arm64, the last time someone remembered to check".
#
# WHY THIS IS SCOPED TO src-milo/** — CLAUDE.md's rule is that self-host parity must never
# block a change in src/, because chasing that parity is what got src-milo parked for
# months. This respects the rule literally rather than reinterpreting it: a commit that
# touches only src/ never triggers this workflow and can never be blocked by it. What the
# path filter DOES catch is a src-milo/ change that breaks the bootstrap — which nothing
# caught before, and which is the actual risk now that src-milo is the compiler that has
# to survive src/ being frozen.
#
# The 587-fixture sweep is deliberately NOT in the push job. It takes ~48 min on the dev
# Mac, and its 4-worker × 1.5 GB pool does not fit a runner — see the nightly job below,
# which runs it serially.

on:
  push:
    paths: ['src-milo/**', 'scripts/selfhost*', 'scripts/guard.ts', '.github/workflows/selfhost.yml']
  pull_request:
    paths: ['src-milo/**', 'scripts/selfhost*', 'scripts/guard.ts', '.github/workflows/selfhost.yml']
  # On demand. The path filter above deliberately excludes `src/` — self-host must never
  # GATE a src/ change (CLAUDE.md; chasing parity is what parked src-milo for months) — but
  # codegen can still break the bootstrap, and then nothing says so until an unrelated
  # src-milo/ or std/ commit happens to run this, or the nightly does.
  #
  # That is not hypothetical: a `%HashMap` field added in src/codegen.ts left typeSize at
  # the old size, every struct holding a map memcpy'd 8 bytes short, and milo-self
  # segfaulted on its first lookup while `bun test` stayed green (fixed in 4f9b5dab). There
  # was no way to re-run this to confirm the fix. Now there is.
  workflow_dispatch:
  schedule:
    # 09:00 UTC daily. The sweep is too slow for the push path but too valuable to run only
    # when someone thinks to.
    - cron: '0 9 * * *'

jobs:
  # The bootstrap proof, and the cheap half of it: stage1 builds, then stage2 and stage3
  # must emit byte-identical IR. A divergence means milo-self compiled by the oracle and
  # milo-self compiled by itself disagree — historically an unaligned enum payload, a
  # hashmap seeded from getentropy, or a string builder leaving cap undefined.
  fixpoint:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The fixpoint links stage2 at -O0 against these; -O0 is what keeps the link honest,
      # since at higher opt levels an unused SSL/sqlite call gets eliminated and a missing
      # flag silently stops mattering.
      - run: brew install openssl@3 sqlite
      - name: Fixed point (stage2 == stage3)
        run: sh scripts/selfhost-fixpoint.sh
      # Rejection is where memory safety actually lives: a compiler that accepts everything
      # scores 100% on the positive corpus. This ratchets against the manifest.
      - name: Soundness ratchet
        run: bun scripts/selfhost-rejects.ts --check
      - name: Type re-derivation ratchet
        run: bun scripts/hir-ratchet.ts --check

  # The positive corpus. Serial (MILO_SWEEP_CONCURRENCY=1) because the parallel pool's
  # memory budget assumes a dev machine, and because milo-self is nondeterministic under
  # parallel load — the sweep re-verifies failures serially anyway, so running it serially
  # from the start only costs wall-clock.
  sweep:
    # schedule + manual, never push: the sweep is the broadest self-host gate and the
    # slowest, so it stays off the push path. But gating it on `schedule` ALONE meant the
    # only way to run it was to wait for tomorrow, which is why a red sweep could sit for
    # days: you cannot bisect a gate you cannot trigger.
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: brew install openssl@3 sqlite
      - run: sh scripts/selfhost.sh
      - name: Fixture sweep
        env:
          MILO_SWEEP_CONCURRENCY: '1'
        run: bun scripts/selfhost-sweep.ts --check

  # Until 2026-08-07 milo-self had never been built on Linux — not "known to fail", never
  # attempted, by anyone. That was the biggest hole in the claim that milo-self can outlive
  # the TypeScript compiler: freezing src/ with one proven host strands every other
  # platform. It passed on the first attempt and has been green since, so this is a real
  # gate, not a probe. milo-self now has two proven hosts and this job is what keeps the
  # second one honest.
  bootstrap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y clang lld libssl-dev libsqlite3-dev
      - name: Build milo-self with the oracle
        run: sh scripts/selfhost.sh
      # Does the compiler milo-self produced actually run on this OS? Kept separate from
      # the build so a failure is unambiguous about which half broke.
      - name: milo-self compiles and runs a program
        run: bun scripts/guard.ts --mem-mb 4000 --timeout-s 300 -- .selfhost/milo-self.bin run examples/hello.milo
