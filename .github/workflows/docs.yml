name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The emulators are their own repo; the docs site only hosts their browser
      # builds. Checked out here so the deployed cores always match that repo's
      # main — nothing emulator-shaped lives in this one.
      - uses: actions/checkout@v4
        with:
          repository: milo-language/milo-emulators
          path: .emulators

      # Compile the Milo emulator cores to JS and stage each demo under the
      # VitePress public dir so they deploy at /milo/emulators/nes/, /genesis/ and
      # /snes/. They must stay siblings under one parent: each page's system-switcher
      # nav links to ../<system>/. The *-core.js checked into the emulators repo is
      # regenerated here so a compiler change can never ship a stale core.
      - name: Build Milo browser demos
        run: |
          bun install
          bun run src/main.ts emit-js .emulators/nes/webcore.milo -o .emulators/nes/web/nes-core.js
          bun run src/main.ts emit-js .emulators/genesis/genesisWebcore.milo -o .emulators/genesis/web/genesis-core.js
          bun run src/main.ts emit-js .emulators/snes/snesWebcore.milo -o .emulators/snes/web/snes-core.js
          mkdir -p docs/site/public/emulators/nes docs/site/public/emulators/genesis docs/site/public/emulators/snes
          cp .emulators/nes/web/index.html .emulators/nes/web/nes-core.js docs/site/public/emulators/nes/
          cp .emulators/genesis/web/index.html .emulators/genesis/web/genesis-core.js docs/site/public/emulators/genesis/
          cp .emulators/snes/web/index.html .emulators/snes/web/snes-core.js docs/site/public/emulators/snes/

      - name: Install dependencies
        run: cd docs/site && bun install

      - name: Build
        # Shiki falls back to plain text for an unregistered fence language and the
        # build still exits 0. That shipped 2076 unhighlighted blocks unnoticed, so
        # the warning is the gate, not the exit code.
        run: |
          cd docs/site
          # pipefail: without it a failed vitepress build exits 0 through tee and the
          # failure surfaces one step later as "dist: No such file or directory".
          set -o pipefail
          bun run build 2>&1 | tee /tmp/vitepress-build.log
          if grep -q "not loaded, falling back" /tmp/vitepress-build.log; then
            echo "::error::a code fence language is not registered with Shiki; blocks rendered as plain text"
            grep -o "The language '[^']*' is not loaded" /tmp/vitepress-build.log | sort -u
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
