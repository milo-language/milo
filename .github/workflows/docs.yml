name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The in-browser emulator demos were compiled here by the JavaScript backend
      # until 2026-09-21. They return once the emulators build for LLVM's wasm64
      # target; until then the site ships docs only.
      - name: Install dependencies
        run: cd docs/site && bun install

      - name: Build
        # Shiki falls back to plain text for an unregistered fence language and the
        # build still exits 0. That shipped 2076 unhighlighted blocks unnoticed, so
        # the warning is the gate, not the exit code.
        run: |
          cd docs/site
          # pipefail: without it a failed vitepress build exits 0 through tee and the
          # failure surfaces one step later as "dist: No such file or directory".
          set -o pipefail
          bun run build 2>&1 | tee /tmp/vitepress-build.log
          if grep -q "not loaded, falling back" /tmp/vitepress-build.log; then
            echo "::error::a code fence language is not registered with Shiki; blocks rendered as plain text"
            grep -o "The language '[^']*' is not loaded" /tmp/vitepress-build.log | sort -u
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
